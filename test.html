<!DOCTYPE html>
<html>
<head>
  <title>FCM Token Generator</title>
</head>
<body>
  <h2>Firebase FCM Token Demo</h2>
  <button id="btn">Get FCM Token</button>
  <pre id="output"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "REPLACE_AT_RUNTIME",
      authDomain: "REPLACE_AT_RUNTIME",
      projectId: "REPLACE_AT_RUNTIME",
      storageBucket: "REPLACE_AT_RUNTIME",
      messagingSenderId: "REPLACE_AT_RUNTIME",
      appId: "REPLACE_AT_RUNTIME"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    const btn = document.getElementById("btn");
    const output = document.getElementById("output");

    btn.onclick = async () => {
      try {
        // ask notification permission
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          alert("Permission denied");
          return;
        }

        const token = await getToken(messaging, {
          vapidKey: "REPLACE_AT_RUNTIME"
        });

        output.textContent = token;
        console.log("FCM Token:", token);

      } catch (err) {
        console.error(err);
      }
    };
  </script>
  <script src="firebase-messaging-sw.js"></script>
</body>
</html>
